          - Ikaskuntzarako Diseinu Unibertsala: gral/a-hasi-aurretik/research-topics/ikaskuntzarako-diseinu-unibertsala.md

  - Prozesuan Zehar:
      - Prozesuan zehar: gral/b-prozesuan-zehar/prozesuan-zehar.md

      - 1 Marko Kontzeptuala Ezarri: gral/b-prozesuan-zehar/1-marko-kontzeptuala-ezarri.md
