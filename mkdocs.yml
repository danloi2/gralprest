site_name: "Hezkuntza Datuak Aztertzen"
site_description: "Guía Didáctica de la Asignatura Metodología de Investigación en Tecnología Educativa"
site_author: "Daniel Losada"

repo_url: "https://github.com/danloi2/gralprest"
repo_name: "danloi2/gralprest"

theme:
  name: material
  language: es

  logo: assets/images/logos/ehu-hefa-negative.svg
  favicon: assets/images/logos/favicon.png

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top

    - search.suggest
    - search.highlight
    - search.share

    - content.code.copy
    - content.tooltips

plugins:
  - search

  - bibtex:
      bib_file: docs/assets/references.bib
      csl_file: docs/assets/apa.csl

  - i18n:
      docs_structure: suffix
      fallback_to_default: true

      languages:
        - locale: es
          name: Español
          default: true

        - locale: eu
          name: Euskara

        - locale: en
          name: English

markdown_extensions:
  - admonition

  - footnotes
  - def_list
  - attr_list
  - md_in_html

  - toc:
      permalink: true

  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social: []

nav:
  - Inicio: index.md

  - Hasi Aurretik:
      - Definizioa: gral/a-hasi-aurretik/definizioa.md

      - GRALen gaiak:
